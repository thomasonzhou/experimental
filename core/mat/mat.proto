edition = "2023";

option optimize_for = LITE_RUNTIME;

package core.v1;

enum MatLayout {
  MAT_LAYOUT_UNSPECIFIED = 0;
  MAT_LAYOUT_NHWC = 1;
  MAT_LAYOUT_NCHW = 2;
}

message Mat {
  bytes data = 1;
  uint32 batch_size = 2;
  uint32 rows = 3;
  uint32 cols = 4;
  uint32 channels = 5;

  MatLayout layout = 6;
}
